name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Archiv finden und entpacken
        run: |
          echo "=== Alle Dateien im Repo ==="
          find . -type f -not -path './.git/*'
          echo "==========================="
          mkdir -p _proj
          found=""
          while IFS= read -r f; do
            if tar -tf "$f" >/dev/null 2>&1; then
              found="$f"
              break
            fi
          done < <(find . -type f -not -path './.git/*' -not -path './.github/*' -not -name '*.md')
          if [ -z "$found" ]; then
            echo "FEHLER: Es wurde keine gueltige TAR-Datei im Repo gefunden. Bitte MCSim.tar hochladen."
            exit 1
          fi
          echo "Entpacke: $found"
          tar -xf "$found" -C _proj
          s=$(find _proj -name settings.gradle.kts | head -n1)
          if [ -z "$s" ]; then
            echo "FEHLER: settings.gradle.kts nicht im Archiv gefunden."
            exit 1
          fi
          d=$(dirname "$s")
          echo "Projektordner: $d"
          echo "PROJECT_DIR=$d" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Debug-APK bauen
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MCSim-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
