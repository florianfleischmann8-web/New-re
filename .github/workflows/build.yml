name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Archiv finden und entpacken
        run: |
          echo "Dateien im Repo:"
          ls -la
          f=$(ls | grep -i 'tar' | head -n1 || true)
          if [ -z "$f" ]; then
            echo "FEHLER: Keine .tar-Datei im Hauptordner des Repos gefunden!"
            exit 1
          fi
          echo "Entpacke: $f"
          mkdir -p _proj
          tar -xf "$f" -C _proj || tar -xzf "$f" -C _proj
          d=$(dirname "$(find _proj -name settings.gradle.kts | head -n1)")
          echo "Projektordner: $d"
          echo "PROJECT_DIR=$d" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Debug-APK bauen
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MCSim-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
